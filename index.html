<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>DODGE.IO — Neon Endless Scroller</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  /* =============================================
     RESET & ROOT VARIABLES
  ============================================= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon-cyan:   #00f5ff;
    --neon-pink:   #ff2d78;
    --neon-green:  #39ff14;
    --neon-yellow: #fff700;
    --bg-dark:     #050510;
    --bg-mid:      #0a0a1f;
    --bg-panel:    #0d0d2b;
    --text-dim:    #4a4a7a;
    --glow-cyan:   0 0 8px #00f5ff, 0 0 20px #00f5ff55, 0 0 40px #00f5ff22;
    --glow-pink:   0 0 8px #ff2d78, 0 0 20px #ff2d7855, 0 0 40px #ff2d7822;
    --glow-green:  0 0 8px #39ff14, 0 0 20px #39ff1455;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-dark);
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  /* =============================================
     SCANLINE OVERLAY (atmospheric detail)
  ============================================= */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
  }

  /* =============================================
     PAGE WRAPPER
  ============================================= */
  #page-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px 8px 40px;
    gap: 10px;
  }

  /* =============================================
     TOP BANNER AD SLOT
  ============================================= */
  #ad-top-banner {
    width: 100%;
    max-width: 728px;
    height: 90px;
    background: var(--bg-panel);
    border: 1px solid #1a1a3a;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  #ad-top-banner::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #0a0a2200, #00f5ff08, #0a0a2200);
  }

  /* =============================================
     GAME HEADER (title + live score)
  ============================================= */
  #game-header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  #game-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--neon-cyan);
    text-shadow: var(--glow-cyan);
  }

  #score-display {
    text-align: right;
  }
  #score-display .label {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #score-display .value {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 700;
    color: var(--neon-green);
    text-shadow: var(--glow-green);
    line-height: 1;
  }
  #hi-score-display {
    text-align: right;
    margin-top: 2px;
  }
  #hi-score-display .label {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }
  #hi-score-display .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--neon-yellow);
    text-shadow: 0 0 8px #fff70088;
  }

  /* =============================================
     CANVAS WRAPPER & CANVAS
  ============================================= */
  #canvas-wrapper {
    position: relative;
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #1a1a4a,
      0 0 30px #00f5ff18,
      0 0 80px #00f5ff08;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    height: auto;
    background: var(--bg-dark);
    touch-action: none;
  }

  /* =============================================
     SPEED TIER INDICATOR
  ============================================= */
  #speed-tier {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.55);
    border: 1px solid #ffffff18;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
    pointer-events: none;
    transition: color 0.4s;
  }

  /* =============================================
     OVERLAY (Start / Game Over / Countdown)
  ============================================= */
  #overlay {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 5, 16, 0.88);
    backdrop-filter: blur(6px);
    z-index: 10;
    gap: 0;
    transition: opacity 0.3s;
  }
  #overlay.hidden { display: none; }

  /* --- Start Screen --- */
  #screen-start, #screen-gameover, #screen-countdown {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 20px 24px;
  }
  #screen-start.active,
  #screen-gameover.active,
  #screen-countdown.active {
    display: flex;
  }

  .screen-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 900;
    letter-spacing: 6px;
    text-align: center;
    line-height: 1.1;
  }
  .screen-title.cyan  { color: var(--neon-cyan);  text-shadow: var(--glow-cyan); }
  .screen-title.pink  { color: var(--neon-pink);  text-shadow: var(--glow-pink); }

  .screen-sub {
    font-size: clamp(10px, 2.5vw, 13px);
    color: #8888bb;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.6;
    max-width: 300px;
  }

  /* Instruction icons row */
  .controls-hint {
    display: flex;
    gap: 18px;
    align-items: center;
    margin: 4px 0;
  }
  .hint-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .hint-icon {
    width: 36px; height: 36px;
    border: 1px solid #2a2a5a;
    border-radius: 8px;
    background: #0d0d2b;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  /* Final score on game over */
  .final-score-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .final-score-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  #final-score-value {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(44px, 12vw, 68px);
    font-weight: 900;
    color: var(--neon-green);
    text-shadow: var(--glow-green);
    line-height: 1;
  }
  #final-hi-note {
    font-size: 11px;
    color: var(--neon-yellow);
    letter-spacing: 2px;
    min-height: 16px;
    text-shadow: 0 0 8px #fff70099;
  }

  /* =============================================
     POST-GAME AD SLOT (inside Game Over screen)
  ============================================= */
  #ad-postgame {
    width: 300px;
    height: 250px;
    background: var(--bg-panel);
    border: 1px solid #1e1e44;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  #ad-postgame::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #00f5ff06, transparent, #ff2d7806);
    pointer-events: none;
  }
  .ad-corner-dot {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: var(--glow-cyan);
  }
  .ad-corner-dot.tl { top: 6px; left: 6px; }
  .ad-corner-dot.tr { top: 6px; right: 6px; }
  .ad-corner-dot.bl { bottom: 6px; left: 6px; }
  .ad-corner-dot.br { bottom: 6px; right: 6px; }

  /* =============================================
     NEON BUTTON
  ============================================= */
  .neon-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 14px 36px;
    border-radius: 6px;
    border: 2px solid var(--neon-cyan);
    background: transparent;
    color: var(--neon-cyan);
    text-shadow: var(--glow-cyan);
    box-shadow: var(--glow-cyan), inset 0 0 20px #00f5ff0a;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .neon-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: var(--neon-cyan);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .neon-btn:hover { box-shadow: 0 0 14px #00f5ff, 0 0 40px #00f5ff66, inset 0 0 30px #00f5ff18; }
  .neon-btn:hover::after { opacity: 0.06; }
  .neon-btn:active { transform: scale(0.97); }
  .neon-btn.pink-btn {
    border-color: var(--neon-pink);
    color: var(--neon-pink);
    text-shadow: var(--glow-pink);
    box-shadow: var(--glow-pink), inset 0 0 20px #ff2d780a;
  }
  .neon-btn.pink-btn::after { background: var(--neon-pink); }
  .neon-btn.pink-btn:hover { box-shadow: 0 0 14px #ff2d78, 0 0 40px #ff2d7866, inset 0 0 30px #ff2d7818; }

  /* =============================================
     COUNTDOWN RING (SVG-based)
  ============================================= */
  #countdown-wrap {
    position: relative;
    width: 100px; height: 100px;
    flex-shrink: 0;
  }
  #countdown-svg {
    transform: rotate(-90deg);
    width: 100px; height: 100px;
  }
  #countdown-track {
    fill: none;
    stroke: #1a1a3a;
    stroke-width: 6;
  }
  #countdown-ring {
    fill: none;
    stroke: var(--neon-cyan);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 264;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 6px #00f5ff);
    transition: stroke-dashoffset 0.05s linear;
  }
  #countdown-number {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: var(--glow-cyan);
  }
  #countdown-msg {
    font-size: 10px;
    color: #6666aa;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    max-width: 220px;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* =============================================
     BOTTOM INFO BAR
  ============================================= */
  #bottom-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .tier-pip {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: var(--glow-cyan);
    margin-right: 5px;
    vertical-align: middle;
  }

  /* =============================================
     FLOATING SOCIAL BAR PLACEHOLDER
  ============================================= */
  #ad-floating-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    background: linear-gradient(180deg, transparent 0%, rgba(5,5,16,0.96) 30%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
    z-index: 100;
    pointer-events: none;
  }
  #ad-floating-bar > * { pointer-events: auto; }

  /* =============================================
     RESPONSIVE TWEAKS
  ============================================= */
  @media (max-width: 500px) {
    #ad-top-banner { height: 60px; }
    .neon-btn { padding: 12px 28px; }
    #ad-postgame { width: 280px; height: 220px; }
  }
</style>
</head>

<script>
"use strict";

const canvas   = document.getElementById('gameCanvas');
const ctx      = canvas.getContext('2d');
const W = canvas.width;   
const H = canvas.height;  

const overlay        = document.getElementById('overlay');
const screenStart    = document.getElementById('screen-start');
const screenGameover = document.getElementById('screen-gameover');
const screenCountdown= document.getElementById('screen-countdown');

const btnStart       = document.getElementById('btn-start');
const btnRetry       = document.getElementById('btn-retry');

const scoreVal       = document.getElementById('score-val');
const hiVal          = document.getElementById('hi-val');
const finalScoreVal  = document.getElementById('final-score-value');
const finalHiNote    = document.getElementById('final-hi-note');
const speedTierEl    = document.getElementById('speed-tier');
const tierLabelBot   = document.getElementById('tier-label-bottom');
const survivalTimeEl = document.getElementById('survival-time');

const cdNumber = document.getElementById('countdown-number');
const cdRing   = document.getElementById('countdown-ring');
const cdMsg    = document.getElementById('countdown-msg');

const TIERS = [
  { label:'TIER 1 — ROOKIE',    color:'#00f5ff', speed:2.8,  spawnRate:80 },
  { label:'TIER 2 — SKILLED',   color:'#39ff14', speed:4.2,  spawnRate:65 },
  { label:'TIER 3 — DANGEROUS', color:'#fff700', speed:5.8,  spawnRate:52 },
  { label:'TIER 4 — INSANE',    color:'#ff8800', speed:7.5,  spawnRate:42 },
  { label:'TIER 5 — GODMODE',   color:'#ff2d78', speed:9.5,  spawnRate:32 },
];
const TIER_INTERVAL_MS = 5000; 
const ORB_RADIUS       = 14;
const OBSTACLE_H       = 28;
const OBSTACLE_GAP_MIN = 130;
const OBSTACLE_GAP_MAX = 190;
const CIRCUMFERENCE    = 264; 

let gameRunning  = false;
let animFrame    = null;
let score        = 0;
let hiScore      = Number(localStorage.getItem('dodgeio_hi') || 0);
let tierIdx      = 0;
let tierTimer    = 0;
let lastTime     = 0;
let frameCount   = 0;
let survivalMs   = 0;

let player = { x: W/2, y: H - 100, vx: 0 };
let obstacles = [];
let stars = [];
let trail = [];
let keys   = { left: false, right: false };
let touchX = null;

function initStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      speed: Math.random() * 0.5 + 0.2,
      alpha: Math.random() * 0.6 + 0.15,
    });
  }
}

function resetGame() {
  score      = 0;
  tierIdx    = 0;
  tierTimer  = 0;
  survivalMs = 0;
  frameCount = 0;
  obstacles  = [];
  trail      = [];
  player     = { x: W/2, y: H - 100, vx: 0 };
  updateScoreUI();
  updateTierUI();
  initStars();
}

function startGame() {
  resetGame();
  gameRunning = true;
  lastTime    = performance.now();
  overlay.classList.add('hidden');
  cancelAnimationFrame(animFrame);
  loop(performance.now());
}

function loop(ts) {
  if (!gameRunning) return;
  const dt = Math.min(ts - lastTime, 50); 
  lastTime  = ts;
  frameCount++;
  survivalMs += dt;

  update(dt);
  draw();
  animFrame = requestAnimationFrame(loop);
}

function update(dt) {
  const tier = TIERS[tierIdx];

  tierTimer += dt;
  if (tierTimer >= TIER_INTERVAL_MS && tierIdx < TIERS.length - 1) {
    tierIdx++;
    tierTimer = 0;
    updateTierUI();
    flashTierUpgrade();
  }

  score = Math.floor(survivalMs / 100);
  updateScoreUI();

  const ACCEL  = 0.55;
  const DRAG   = 0.78;
  const MAXSPD = 6.5;

  if (keys.left)  player.vx -= ACCEL;
  if (keys.right) player.vx += ACCEL;

  if (touchX !== null) {
    const diff = touchX - player.x;
    player.vx += diff * 0.07;
  }

  player.vx *= DRAG;
  player.vx  = Math.max(-MAXSPD, Math.min(MAXSPD, player.vx));
  player.x  += player.vx;
  player.x   = Math.max(ORB_RADIUS, Math.min(W - ORB_RADIUS, player.x));

  trail.push({ x: player.x, y: player.y, age: 0 });
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].age += dt;
    if (trail[i].age > 300) trail.splice(i, 1);
  }

  if (frameCount % tier.spawnRate === 0) {
    spawnObstacle(tier.speed);
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y += obstacles[i].speed * (dt / 16.67);
    if (obstacles[i].y > H + OBSTACLE_H) {
      obstacles.splice(i, 1);
      continue;
    }
    if (checkCollision(obstacles[i])) {
      triggerGameOver();
      return;
    }
  }

  const starSpeed = 0.3 + tierIdx * 0.12;
  for (const s of stars) {
    s.y += s.speed * starSpeed * (dt / 16.67);
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function spawnObstacle(speed) {
  const gap  = OBSTACLE_GAP_MIN + Math.random() * (OBSTACLE_GAP_MAX - OBSTACLE_GAP_MIN);
  const gapX = ORB_RADIUS * 3 + Math.random() * (W - gap - ORB_RADIUS * 6);
  const spd  = speed * (0.85 + Math.random() * 0.3);
  obstacles.push({ x: gapX, gapW: gap, y: -OBSTACLE_H, speed: spd });
}

function checkCollision(obs) {
  const py = player.y;
  const px = player.x;
  if (py + ORB_RADIUS < obs.y || py - ORB_RADIUS > obs.y + OBSTACLE_H) return false;
  if (px - ORB_RADIUS < obs.x) return true;
  if (px + ORB_RADIUS > obs.x + obs.gapW) return true;
  return false;
}

function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
  drawGrid();

  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle   = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const t of trail) {
    const p = 1 - t.age / 300;
    ctx.globalAlpha = p * 0.35;
    ctx.fillStyle   = TIERS[tierIdx].color;
    const r = ORB_RADIUS * p * 0.7;
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const obs of obstacles) {
    drawObstacle(obs);
  }

  drawOrb(player.x, player.y);
}

function drawGrid() {
  ctx.strokeStyle = '#0d0d2b';
  ctx.lineWidth   = 1;
  const step = 48;
  for (let x = 0; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawObstacle(obs) {
  const col  = TIERS[tierIdx].color;
  const leftW  = obs.x;
  const rightX = obs.x + obs.gapW;
  const rightW = W - rightX;

  const gradL = ctx.createLinearGradient(0, obs.y, leftW, obs.y);
  gradL.addColorStop(0,   '#0a0a1f');
  gradL.addColorStop(1,   col + '44');
  ctx.fillStyle = gradL;
  ctx.fillRect(0, obs.y, leftW, OBSTACLE_H);

  const gradR = ctx.createLinearGradient(rightX, obs.y, W, obs.y);
  gradR.addColorStop(0,   col + '44');
  gradR.addColorStop(1,   '#0a0a1f');
  ctx.fillStyle = gradR;
  ctx.fillRect(rightX, obs.y, rightW, OBSTACLE_H);

  ctx.shadowColor = col;
  ctx.shadowBlur  = 14;
  ctx.strokeStyle = col;
  ctx.lineWidth   = 2;

  ctx.beginPath(); ctx.moveTo(leftW, obs.y); ctx.lineTo(leftW, obs.y + OBSTACLE_H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rightX, obs.y); ctx.lineTo(rightX, obs.y + OBSTACLE_H); ctx.stroke();
  ctx.shadowBlur = 0;

  const midX = obs.x + obs.gapW / 2;
  const grad = ctx.createRadialGradient(midX, obs.y + OBSTACLE_H/2, 0, midX, obs.y + OBSTACLE_H/2, obs.gapW/2);
  grad.addColorStop(0,   col + '18');
  grad.addColorStop(1,   'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(obs.x, obs.y, obs.gapW, OBSTACLE_H);
}

function drawOrb(x, y) {
  const col = TIERS[tierIdx].color;
  ctx.shadowColor = col;
  ctx.shadowBlur  = 28;
  ctx.strokeStyle = col + 'aa';
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.arc(x, y, ORB_RADIUS + 5, 0, Math.PI * 2);
  ctx.stroke();

  const grad = ctx.createRadialGradient(x - ORB_RADIUS*0.35, y - ORB_RADIUS*0.35, 1, x, y, ORB_RADIUS);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.4, col);
  grad.addColorStop(1, col + '44');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, ORB_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function triggerGameOver() {
  gameRunning = false;
  cancelAnimationFrame(animFrame);

  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('dodgeio_hi', hiScore);
  }
  hiVal.textContent = hiScore;

  overlay.classList.remove('hidden');
  showScreen('gameover');
  animateScoreCountUp(0, score, 900);
}

function animateScoreCountUp(from, to, duration) {
  finalHiNote.textContent = '';
  const start = performance.now();
  function step(ts) {
    const p = Math.min((ts - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    finalScoreVal.textContent = Math.floor(from + (to - from) * ease);
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      finalScoreVal.textContent = to;
      if (score >= hiScore && score > 0) {
        finalHiNote.textContent = '✦ NEW BEST ✦';
      }
    }
  }
  requestAnimationFrame(step);
}

function startCountdown() {
  showScreen('countdown');
  const TOTAL = 3000;
  let elapsed = 0;
  let lastTs  = performance.now();

  const msgs = [
    'Loading your next run…',
    'Recalibrating obstacles…',
    'Warming up the grid…',
  ];
  let msgIdx = 0;
  cdMsg.textContent = msgs[msgIdx];

  function tick(ts) {
    const dt = ts - lastTs;
    lastTs = ts;
    elapsed += dt;

    const remaining = Math.max(0, TOTAL - elapsed);
    const progress  = elapsed / TOTAL; 

    cdRing.style.strokeDashoffset = (progress * CIRCUMFERENCE).toFixed(2);
    const secs = Math.ceil(remaining / 1000);
    cdNumber.textContent = secs;

    const newMsgIdx = Math.min(Math.floor(progress * msgs.length), msgs.length - 1);
    if (newMsgIdx !== msgIdx) {
      msgIdx = newMsgIdx;
      cdMsg.textContent = msgs[msgIdx];
    }

    if (elapsed < TOTAL) {
      requestAnimationFrame(tick);
    } else {
      cdRing.style.strokeDashoffset = '0';
      startGame();
    }
  }
  requestAnimationFrame(tick);
}

let flashAlpha = 0;
let flashColor = '#00f5ff';
function flashTierUpgrade() {
  flashColor = TIERS[tierIdx].color;
  flashAlpha = 0.35;
  const fadeFlash = () => {
    if (flashAlpha <= 0) return;
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle   = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    flashAlpha -= 0.025;
    if (gameRunning) requestAnimationFrame(fadeFlash);
  };
  fadeFlash();
}

function showScreen(name) {
  screenStart.classList.remove('active');
  screenGameover.classList.remove('active');
  screenCountdown.classList.remove('active');
  if (name === 'start')     screenStart.classList.add('active');
  if (name === 'gameover')  screenGameover.classList.add('active');
  if (name === 'countdown') screenCountdown.classList.add('active');
}

function updateScoreUI() {
  scoreVal.textContent = score;
  hiVal.textContent    = hiScore;
  survivalTimeEl.textContent = (survivalMs / 1000).toFixed(1) + 's survived';
}

function updateTierUI() {
  const t = TIERS[tierIdx];
  speedTierEl.textContent       = t.label;
  speedTierEl.style.color       = t.color;
  tierLabelBot.textContent      = t.label;
  document.querySelector('.tier-pip').style.background  = t.color;
  document.querySelector('.tier-pip').style.boxShadow   = `0 0 6px ${t.color}`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
  touchX = (touchX / canvas.getBoundingClientRect().width) * W;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
  touchX = (touchX / canvas.getBoundingClientRect().width) * W;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchX = null;
}, { passive: false });

btnStart.addEventListener('click', () => { startGame(); });
btnRetry.addEventListener('click', () => {
  showScreen('countdown');
  startCountdown();
});

(function drawIdle() {
  initStars();
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
  drawGrid();
  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle   = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawOrb(W/2, H - 100);
  hiScore = Number(localStorage.getItem('dodgeio_hi') || 0);
  hiVal.textContent = hiScore;
})();
</script>
